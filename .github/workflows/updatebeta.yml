name: Upload updatebeta.json to Supabase

on:
  push:
    paths:
      - "json/updatebeta.json"
  workflow_dispatch:

concurrency:
  group: supabase-updatebeta.json
  cancel-in-progress: true

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Requests
        run: pip install requests

      - name: Subir updatebeta.json a Supabase Buckets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python << 'EOF'
          import os, requests
          url_base = os.environ['SUPABASE_URL'].strip()
          key = os.environ['SUPABASE_SERVICE_ROLE_KEY'].strip()

          # TRIPLE BUCKET STRATEGY (v175)
          buckets = ["NovaLogic", "Novaplay", "novaconnect"]
          headers = {
              "Authorization": f"Bearer {key}",
              "apikey": key,
              "Content-Type": "application/json",
              "x-upsert": "true"
          }

          # Source is in json/ folder in repo
          file_path = "json/updatebeta.json"

          with open(file_path, "rb") as f:
              data = f.read()
              for bucket in buckets:
                  # Upload to ROOT of each bucket
                  url = f"{url_base}/storage/v1/object/{bucket}/updatebeta.json"
                  r = requests.post(url, headers=headers, data=data)
                  print(f"Bucket {bucket} (updatebeta.json): {r.status_code}")
          EOF

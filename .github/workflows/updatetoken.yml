name: Upload token.json to Supabase

on:
  push:
    paths:
      - "json/token.json"
  workflow_dispatch:

concurrency:
  group: supabase-token.json
  cancel-in-progress: true

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Requests
        run: pip install requests
      - name: Subir token.json a Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python << 'EOF'
          import os, requests
          url = os.environ['SUPABASE_URL'].strip()
          key = os.environ['SUPABASE_SERVICE_ROLE_KEY'].strip()

          url_logic = f"{url}/storage/v1/object/NovaLogic/{os.path.basename('json/token.json')}"
          url_connect = f"{url}/storage/v1/object/novaconnect/{os.path.basename('json/token.json')}"

          headers = {
              "Authorization": f"Bearer {key}",
              "apikey": key,
              "Content-Type": "application/json",
              "x-upsert": "true"
          }

          with open("json/token.json", "rb") as f:
              data = f.read()
              r1 = requests.post(url_logic, headers=headers, data=data)
              print(f"NovaLogic: {r1.status_code}")
              r2 = requests.post(url_connect, headers=headers, data=data)
              print(f"novaconnect Mirror: {r2.status_code}")
          if r1.status_code >= 400 or r2.status_code >= 400: exit(1)
          EOF

name: Upload novapanel.apk to HankNova

on:
  push:
    paths:
      - "apks/novapanel.apk"
  workflow_dispatch:

concurrency:
  group: hanknova-novapanel.apk
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Subir novapanel.apk a NovaplayGO/updater
        run: |
          git config --global user.name "HankNova Auto-Updater"
          git config --global user.email "updater@hanknova.com"
          git clone https://x-access-token:${{ secrets.UPDATER_TOKEN }}@github.com/NovaplayGO/updater.git temp_repo
          mkdir -p temp_repo/apks
          cp apks/novapanel.apk temp_repo/apks/
          cd temp_repo
          git add apks/novapanel.apk
          git commit -m "Update: novapanel.apk" || exit 0
          git push origin main || (git pull origin main --rebase && git push origin main)


name: Upload eventos.json to Supabase

on:
  push:
    paths:
      - "json/eventos.json"
  workflow_dispatch:

concurrency:
  group: supabase-eventos.json
  cancel-in-progress: true

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Requests
        run: pip install requests
      - name: Subir eventos.json a Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python << 'EOF'
          import os, requests
          url_base = os.environ['SUPABASE_URL'].strip()
          key = os.environ['SUPABASE_SERVICE_ROLE_KEY'].strip()

          # ESTRATEGIA DUAL: NovaLogic (Nuevo) y novaconnect (Retrocompatibilidad)
          buckets = ["NovaLogic", "novaconnect"]
          headers = {
              "Authorization": f"Bearer {key}",
              "apikey": key,
              "Content-Type": "application/json",
              "x-upsert": "true"
          }

          file_path = "json/eventos.json"
          if not os.path.exists(file_path): file_path = "eventos.json"

          with open(file_path, "rb") as f:
              data = f.read()
              for bucket in buckets:
                  url = f"{url_base}/storage/v1/object/{bucket}/eventos.json"
                  r = requests.post(url, headers=headers, data=data)
                  print(f"Bucket {bucket}: {r.status_code}")
          if r.status_code >= 400: exit(1)
          EOF
